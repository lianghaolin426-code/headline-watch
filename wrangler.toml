name = "headline-watch"
main = "src/index.js"
compatibility_date = "2025-10-01"

# 每分钟跑一次（Cloudflare 免费版支持的最短间隔）
[triggers]
crons = ["* * * * *"]

# Cloudflare Workers AI（免费版每天 1 万 neurons，用完当天自动退回规则判断，不会收费）
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "headline-watch"
database_id = "eb5967b8-b07e-4a1f-977b-825f928fe7ea"

[vars]
# Cloudflare 自己抓的 RSS 源。
# Telegram 频道和 Google 新闻会拒绝 Cloudflare 的访问，所以 Telegram 改由 GitHub 定时任务抓取后推送到 /api/ingest（见 .github/workflows/telegram.yml）。
SOURCES = '''
[
  {"type": "rss", "name": "CNBC", "url": "https://www.cnbc.com/id/100003114/device/rss/rss.html"},
  {"type": "rss", "name": "Investing.com", "url": "https://www.investing.com/rss/news_25.rss"},
  {"type": "rss", "name": "investingLive", "url": "https://investinglive.com/feed"},
  {"type": "rss", "name": "WSJ Markets", "url": "https://feeds.content.dowjones.io/public/rss/RSSMarketsMain"},
  {"type": "rss", "name": "Seeking Alpha Currents", "url": "https://seekingalpha.com/market_currents.xml"},
  {"type": "rss", "name": "FinancialJuice", "url": "https://www.financialjuice.com/feed.ashx?xy=rss", "every": 5},
  {"type": "rss", "name": "Unusual Whales (Bluesky)", "url": "https://bsky.app/profile/unusualwhales.bsky.social/rss"},
  {"type": "rss", "name": "WSJ (Bluesky)", "url": "https://bsky.app/profile/wsj.com/rss"},
  {"type": "rss", "name": "Reuters (Bluesky)", "url": "https://bsky.app/profile/reuters.com/rss"},
  {"type": "rss", "name": "Bloomberg (Bluesky)", "url": "https://bsky.app/profile/bloomberg.com/rss"},
  {"type": "rss", "name": "AP (Bluesky)", "url": "https://bsky.app/profile/apnews.com/rss"},
  {"type": "rss", "name": "CNBC (Bluesky)", "url": "https://bsky.app/profile/cnbc.com/rss"},
  {"type": "rss", "name": "FT (Bluesky)", "url": "https://bsky.app/profile/financialtimes.com/rss"},
  {"type": "rss", "name": "Barron's (Bluesky)", "url": "https://bsky.app/profile/barrons.com/rss"},
  {"type": "rss", "name": "Nasdaq", "url": "https://www.nasdaq.com/feed/rssoutbound?category=Markets"},
  {"type": "rss", "name": "BBC Business", "url": "https://feeds.bbci.co.uk/news/business/rss.xml"},
  {"type": "rss", "name": "Federal Reserve", "url": "https://www.federalreserve.gov/feeds/press_all.xml"},
  {"type": "rss", "name": "PR Newswire", "url": "https://www.prnewswire.com/rss/news-releases-list.rss"},
  {"type": "cnjson", "format": "wscn", "name": "华尔街见闻", "focus": true, "url": "https://api-one-wscn.awtmt.com/apiv1/content/lives?channel=global-channel&limit=30"},
  {"type": "cnjson", "format": "gelonghui", "name": "格隆汇", "focus": true, "url": "https://www.gelonghui.com/api/live-channels/all/lives/v4?category=all&limit=30"},
  {"type": "rss", "name": "Argaam", "tzHours": 3, "url": "https://www.argaam.com/en/rss/ho-main-news?sectionid=1524"},
  {"type": "rss", "name": "Arab News", "url": "https://www.arabnews.com/rss.xml"}
]
'''

# 关键词（逗号分隔，不区分大小写）。命中任意一个就推送。
KEYWORDS = "short sellers, bankruptcy, halts trading, ousted, 破产"

# 重要性评分（0-10）达到多少分才算重要、才推送
AI_THRESHOLD = "8"
# AI 打分时顺便给 5 分以上的快讯贴标签：利好/利空方向、股票代码、话题、板块（看板的热门股票、话题、多空情绪用）。
# 需要先跑 migrate-v6.sql。设为 "false" 就回到只打分。
AI_TAGS = "true"

# AI 打分开关；关掉则只用规则（关键词或 >= BIG_NUMBER_MIN_BILLION 十亿美元的金额 = 8 分）
AI_SCORING = "true"
BIG_NUMBER_MIN_BILLION = "10"

# 来源加权：加到 AI 分上。快讯类频道更快，加分；综合新闻账号（夹杂科普、生活类）减分，但它们仍可作为“多源互证”的佐证
SOURCE_WEIGHTS = '{"Walter Bloomberg": 1, "First Squawk": 0.5, "FinancialJuice": 0.5, "Unusual Whales (Bluesky)": 0.5, "WSJ Markets": 0.5, "WSJ (Bluesky)": -1, "AP (Bluesky)": -1, "CNBC (Bluesky)": -0.5, "BBC Business": -0.5, "Arab News": -1, "格隆汇": -0.5}'

# 是否把“含大数字”的快讯也算粗筛命中（如 $24 billion、2万亿美元）
BIG_NUMBERS = "true"

# matched = 只推送命中的；all = 全部推送；off = 不推送只入库
NOTIFY_MODE = "matched"

# 只推送发布时间在多少分钟以内的
MAX_AGE_MINUTES = "30"

# 推送渠道的密钥请用 `npx wrangler secret put 名字` 设置，不要写在这里：
#   BARK_URL         iPhone Bark，形如 https://api.day.app/你的key
#   NTFY_TOPIC       ntfy 主题名（可选 NTFY_SERVER、NTFY_TOKEN）
#   WECOM_WEBHOOK    企业微信群机器人地址
#   PUSHPLUS_TOKEN   PushPlus 微信推送
#   TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID
#   DISCORD_WEBHOOK
#   RESEND_API_KEY + EMAIL_TO + EMAIL_FROM   邮件
#   WEBHOOK_URL      任意 webhook
#   ACCESS_KEY       设了之后，网页需要 ?key=这个密码 才能打开

# 服务器端中英互译：让手机和非 Chrome 浏览器也有译文（电脑 Chrome 仍可在浏览器里自己翻）。
# TRANSLATE_PROVIDER = "mymemory"：免费公共接口 MyMemory，只翻标题，不占 Workers AI 额度；
#   邮箱放在机密变量 MYMEMORY_EMAIL 里（wrangler secret put MYMEMORY_EMAIL），带邮箱每天约 5 万字符。
# TRANSLATE_PROVIDER = "ai"：Workers AI，标题和摘要都翻，和评分共用免费额度。可用 TRANSLATE_MODEL 换模型。
# 只翻评分达到 TRANSLATE_MIN_SCORE 的快讯，额度用完时显示原文。
TRANSLATE = "true"
TRANSLATE_PROVIDER = "mymemory"
TRANSLATE_MIN_SCORE = "6"
MAX_TRANSLATE_PER_RUN = "5"
